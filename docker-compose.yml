# Local infrastructure only (run with OrbStack). Apps (api, web) run natively on the host.
name: koreader-dashboard

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koreader}
      POSTGRES_DB: ${POSTGRES_DB:-koreader_dashboard}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
