name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Gitflow source and target branches
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            main)
              [[ "$HEAD" =~ ^(release/v[0-9]+\.[0-9]+\.[0-9]+|hotfix/[a-z0-9._-]+)$ ]] && exit 0
              echo "::error::main only accepts release/vX.Y.Z or hotfix/<name> branches."
              ;;
            development)
              [[ "$HEAD" =~ ^(feature|bugfix)/[a-z0-9._-]+$ ]] && exit 0
              [[ "$HEAD" =~ ^(release/v[0-9]+\.[0-9]+\.[0-9]+|hotfix/[a-z0-9._-]+|main)$ ]] && exit 0
              echo "::error::development only accepts feature/<name>, bugfix/<name>, release/*, hotfix/* or main (back-merge)."
              ;;
            *)
              echo "::error::PRs must target main or development."
              ;;
          esac
          exit 1

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Conventional Commits PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $TITLE"
          re='^(feat|fix|refactor|perf|docs|style|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+$'
          [[ "$TITLE" =~ $re ]] && exit 0
          echo "::error::PR title must follow Conventional Commits, e.g. 'feat(api): add ingest endpoint'."
          exit 1
